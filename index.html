<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Crash Casino Game built with PixiJS"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Crash Game</title>

    <style>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  overflow: hidden;
  background: #0f172a;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  width: 100vw;
  height: 100vh;
}

.HUD {
  width: 260px;
  background: #111827;
  color: white;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  border-right: 1px solid #1f2937;
}




button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}


#betbtn {
  background: #22c55e;
  color: black;
}




#cashout {
  background: #ef4444;
  color: white;
}




#canvas {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0f172a;

  border: 5px solid yellow;
  border-radius: 5px;
}</style>
  </head>

  <body>
    <div id="app"></div>
    <div class="HUD">
      
     <h3>Balance :  <span id="balanceText"></span>  $</h3>
     <div class="betButton">
      <button id="betbtn"> Bet 100 $</button>
     </div>

      <div class="cashoutbtn">
      <button id="cashout"> CASHOUT</button>
     </div>
    </div>

   
        <div id="canvas"></div>
       
    
  

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
